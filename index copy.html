<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Resonate - Animated Circular Menu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        neonGreen: '#00FF26',
                        darkBg: '#080c14',
                        panelBg: '#0f172a',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060911;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Ambient Glow & Grid */
        .bg-grid {
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 255, 38, 0.08) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* Circular Menu Track Ticks */
        .dial-ticks {
            background: repeating-conic-gradient(from 0deg,
                    rgba(0, 255, 38, 0.4) 0deg 1deg,
                    transparent 1deg 15deg);
            mask-image: radial-gradient(circle, transparent 58%, black 60%, black 68%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle, transparent 58%, black 60%, black 68%, transparent 70%);
        }

        /* Glow effects */
        .neon-glow {
            filter: drop-shadow(0 0 10px rgba(0, 255, 38, 0.6)) drop-shadow(0 0 20px rgba(0, 255, 38, 0.3));
        }

        .neon-glow-lg {
            filter: drop-shadow(0 0 15px rgba(0, 255, 38, 0.9)) drop-shadow(0 0 30px rgba(0, 255, 38, 0.5));
        }

        .text-glow {
            text-shadow: 0 0 12px rgba(0, 255, 38, 0.8), 0 0 25px rgba(0, 255, 38, 0.4);
        }

        /* Lightning Flash Effect */
        .lightning-flash {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(0, 255, 38, 0.8) 0%, rgba(0, 255, 38, 0.2) 40%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 40;
        }

        /* Button Hover Transition */
        .menu-btn-item {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .menu-btn-item:hover {
            filter: drop-shadow(0 0 15px rgba(0, 255, 38, 0.9));
        }
    </style>
</head>

<body class="w-screen h-screen bg-grid flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Header info -->
    <header class="absolute top-6 left-8 z-50 flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-neonGreen animate-pulse"></div>
        <span class="font-orbitron tracking-widest text-xs text-gray-400 uppercase">Resonate Interactive Dial
            v2.0</span>
    </header>

    <!-- Controls & Instructions overlay -->
    <footer class="absolute bottom-6 z-50 text-center text-xs text-gray-500 font-rajdhani tracking-wider">
        <p>MOVA O MOUSE AO REDOR DO CÍRCULO PARA GIRAR O MENU &bull; CLIQUE NOS ÍCONES PARA INTERAGIR</p>
    </footer>

    <!-- Main Stage Canvas -->
    <div id="stage" class="relative w-[540px] h-[540px] flex items-center justify-center">

        <!-- Outer Decorative Rings -->
        <div class="absolute inset-0 rounded-full border border-emerald-500/20 pointer-events-none"></div>
        <div class="absolute inset-[15px] rounded-full border border-emerald-500/10 pointer-events-none"></div>
        <div class="absolute inset-[40px] dial-ticks rounded-full opacity-60 pointer-events-none"></div>
        <div
            class="absolute inset-[90px] rounded-full border border-dashed border-emerald-500/30 pointer-events-none animate-[spin_60s_linear_infinite]">
        </div>

        <!-- Lightning / Pulse Overlay -->
        <div id="flash-effect" class="lightning-flash"></div>

        <!-- ROTATING MENU WHEEL CONTAINER -->
        <div id="menu-wheel"
            class="absolute w-[440px] h-[440px] rounded-full flex items-center justify-center transition-none cursor-pointer">
            <!-- 8 Perimeter Menu Items will be generated here -->
        </div>

        <!-- CENTER DISPLAY HUB -->
        <div id="center-hub"
            class="absolute w-[210px] h-[210px] rounded-full bg-[#0a0f1c]/90 border-2 border-emerald-500/40 backdrop-blur-md shadow-[0_0_40px_rgba(0,0,0,0.8)] flex flex-col items-center justify-center z-30 cursor-pointer group hover:border-neonGreen transition-colors duration-300">

            <!-- Central Glowing Ring -->
            <div
                class="absolute inset-2 rounded-full border border-emerald-500/20 group-hover:border-emerald-500/60 transition-colors">
            </div>

            <!-- Logo Top -->
            <div id="center-logo" class="flex flex-col items-center text-center transition-all duration-300">
                <span
                    class="font-orbitron font-bold text-xs tracking-[0.25em] text-emerald-400/80 uppercase">PORT</span>
                <span
                    class="font-orbitron font-extrabold text-lg tracking-widest text-white drop-shadow-[0_0_8px_rgba(0,255,38,0.5)]">NATHAN</span>
                <span class="font-rajdhani text-[10px] tracking-widest text-emerald-500/60 uppercase">.com.br</span>
            </div>

            <!-- Active Item Label Display -->
            <div id="active-label-container"
                class="absolute bottom-6 w-full text-center px-2 opacity-0 pointer-events-none transform translate-y-2 transition-all">
                <span id="active-label"
                    class="font-orbitron font-bold text-sm tracking-wider text-neonGreen text-glow uppercase block truncate"></span>
            </div>
        </div>

    </div>

    <!-- GSAP Script (Local with CDN fallback) -->
    <script src="../wp-content/themes/condobuby-fullbychild/js/gsap.min.js"></script>
    <script>
        if (typeof gsap === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>');
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Menu Items Definition (8 Items based on AS3 source code)
            const menuData = [
                { id: 'btHiper', label: 'WebDesign', title: 'Desenvolvimento Web' },
                { id: 'btIlustra', label: 'Ilustração', title: 'Artes Vetuariais' },
                { id: 'btAnima', label: 'Animação', title: 'Motion & FX' },
                { id: 'btVisu', label: 'Identidade Visual', title: 'Branding & UI' },
                { id: 'btSobre', label: 'About Me', title: 'Sobre Nathan' },
                { id: 'btCur', label: 'Hire Me', title: 'Contato Pro' },
                { id: 'bt6', label: 'Portfolio', title: 'Projetos 3D' },
                { id: 'bt8', label: 'Contact', title: 'Fale Conosco' }
            ];

            const stage = document.getElementById('stage');
            const wheel = document.getElementById('menu-wheel');
            const centerHub = document.getElementById('center-hub');
            const centerLogo = document.getElementById('center-logo');
            const activeLabelContainer = document.getElementById('active-label-container');
            const activeLabel = document.getElementById('active-label');
            const flashEffect = document.getElementById('flash-effect');

            const radius = 185; // Radius of menu circle in pixels
            const itemCount = menuData.length;
            const itemElements = [];
            const iconElements = [];

            // 1. Build Perimeter Buttons around circle ring
            menuData.forEach((item, index) => {
                const angleDeg = (index * 360) / itemCount; // 0, 45, 90, 135, 180, 225, 270, 315
                const angleRad = (angleDeg * Math.PI) / 180;

                // Position relative to wheel center
                const x = radius * Math.cos(angleRad);
                const y = radius * Math.sin(angleRad);

                // Create Item Wrapper Button
                const btn = document.createElement('button');
                btn.className = 'menu-btn-item absolute w-14 h-14 rounded-full bg-[#0b1322] border-2 border-emerald-500/40 flex items-center justify-center shadow-[0_0_15px_rgba(0,255,38,0.2)] hover:border-neonGreen hover:bg-[#122238] hover:scale-110 cursor-pointer z-20 group';
                btn.style.left = `calc(50% + ${x}px - 28px)`;
                btn.style.top = `calc(50% + ${y}px - 28px)`;
                btn.setAttribute('data-index', index);
                btn.setAttribute('aria-label', item.label);

                // Inner Container (Used for Counter-Rotation to keep upright)
                const inner = document.createElement('div');
                inner.className = 'w-full h-full flex items-center justify-center p-2.5 transition-transform';

                // SVG Icon Element using sampleicon.svg
                const img = document.createElement('img');
                img.src = 'sampleicon.svg';
                img.alt = item.label;
                img.className = 'w-full h-full object-contain neon-glow group-hover:scale-115 transition-transform duration-200';

                inner.appendChild(img);
                btn.appendChild(inner);
                wheel.appendChild(btn);

                itemElements.push(btn);
                iconElements.push(inner);

                // Hover Events for Buttons
                btn.addEventListener('mouseenter', () => showItemLabel(item.label));
                btn.addEventListener('mouseleave', () => hideItemLabel());
                btn.addEventListener('click', (e) => handleItemClick(e, item));
            });

            // 2. Continuous Mouse Rotation Engine (AS3 Port)
            let targetAngle = 0;
            let currentAngle = 0;
            let lastMouseAngle = 0;
            let isMouseActive = false;
            const dragFactor = 0.12; // Smooth lerp coefficient

            function getStageCenter() {
                const rect = stage.getBoundingClientRect();
                return {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
            }

            // Track mouse movement across stage
            window.addEventListener('mousemove', (e) => {
                const center = getStageCenter();
                const distX = center.x - e.clientX;
                const distY = center.y - e.clientY;

                // Check distance from center to activate rotation
                const distFromCenter = Math.hypot(distX, distY);

                if (distFromCenter < 350) {
                    isMouseActive = true;
                    // AS3: radians = Math.atan2(distX, distY);
                    const radians = Math.atan2(distX, distY);
                    let degrees = (radians * 180) / Math.PI;

                    // Calculate continuous rotation without angle flipping (-180 / 180)
                    let delta = degrees - lastMouseAngle;
                    if (delta > 180) delta -= 360;
                    if (delta < -180) delta += 360;

                    targetAngle += delta;
                    lastMouseAngle = degrees;
                } else {
                    isMouseActive = false;
                }
            });

            // GSAP Ticker for 60fps smooth physics loop
            gsap.ticker.add(() => {
                // Smooth interpolation (Lerp towards target angle)
                currentAngle += (targetAngle - currentAngle) * dragFactor;

                // Rotate outer wheel container
                wheel.style.transform = `rotate(${currentAngle}deg)`;

                // Counter-rotate button inner icons to maintain upright orientation
                iconElements.forEach(icon => {
                    icon.style.transform = `rotate(${-currentAngle}deg)`;
                });
            });

            // 3. Center Text Display Animations (Matching Flash AS3 TweenMax logic)
            function showItemLabel(label) {
                activeLabel.textContent = label;

                // Tween center logo up slightly & fade in text
                gsap.to(centerLogo, {
                    y: -12,
                    scale: 0.85,
                    opacity: 0.7,
                    duration: 0.25,
                    ease: 'power2.out'
                });

                gsap.fromTo(activeLabelContainer,
                    { opacity: 0, y: 15, scale: 0.8 },
                    { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: 'back.out(1.7)' }
                );
            }

            function hideItemLabel() {
                gsap.to(centerLogo, {
                    y: 0,
                    scale: 1,
                    opacity: 1,
                    duration: 0.3,
                    ease: 'power2.out'
                });

                gsap.to(activeLabelContainer, {
                    opacity: 0,
                    y: 10,
                    duration: 0.2,
                    ease: 'power2.in'
                });
            }

            // Center logo hover effect
            centerHub.addEventListener('mouseenter', () => showItemLabel('HOME'));
            centerHub.addEventListener('mouseleave', () => hideItemLabel());
            centerHub.addEventListener('click', (e) => handleItemClick(e, { label: 'HOME', title: 'Página Inicial' }));

            // 4. Click Electric Flash & Scale Animation
            function handleItemClick(e, item) {
                e.stopPropagation();

                // Trigger Flash / Lightning Overlay
                gsap.fromTo(flashEffect,
                    { opacity: 1, scale: 0.8 },
                    { opacity: 0, scale: 1.2, duration: 0.4, ease: 'power2.out' }
                );

                // Pulse Stage Center
                gsap.fromTo(centerHub,
                    { scale: 0.95 },
                    { scale: 1, duration: 0.3, ease: 'elastic.out(1.2, 0.4)' }
                );

                // Visual click feedback on label
                activeLabel.textContent = `▶ ${item.label}`;
                gsap.fromTo(activeLabel,
                    { color: '#ffffff' },
                    { color: '#00FF26', duration: 0.5 }
                );
            }
        });
    </script>
</body>

</html>
